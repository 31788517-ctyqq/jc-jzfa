server {
    listen 80;
    server_name zj.100qiu.com;
    charset utf-8;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name zj.100qiu.com;
    charset utf-8;
    ssl_certificate /etc/nginx/ssl/zj.crt;
    ssl_certificate_key /etc/nginx/ssl/zj.key;
    ssl_protocols TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!MD5;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml application/xml text/xml;
    location /assets/ { alias /var/www/zj.100qiu.com/miniprogram/images/; expires -1; }
    location /api { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /health { proxy_pass http://127.0.0.1:3000; }

    # === Brotli: rewrite-based static pre-compression (20260621) ===
    location / {
        root /var/www/zj.100qiu.com/preview;
        set $br_try 0;
        if ($br_suffix) { set $br_try 1; }
        if ($br_suffix = "") { set $br_try 0; }
        if (!-f /var/www/zj.100qiu.com/preview$uri.br) { set $br_try 0; }
        if ($br_try = 1) { rewrite ^ /__brotli$uri break; }
        try_files $uri /index.html;
        max_ranges 0;
        if ($arg_v) {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        if ($arg_v = "") {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }
    }
    location /__brotli/ {
        internal;
        rewrite ^/__brotli(.+)$ $1.br break;
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding;
        types { }
        default_type application/octet-stream;
        root /var/www/zj.100qiu.com/preview;
    }
    # === End Brotli ===

    add_header X-Frame-Options SAMEORIGIN always;
}
