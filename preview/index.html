      // ★ 阻塞脚本：恢复上次页面状态（主页为默认，其他页面由JS动态创建）
      (function () {
        try {
          var last = sessionStorage.getItem('lastPage');
          if (last && last !== 'home' && last !== 'detail') {
            var tb = document.getElementById('tab-' + last);
            if (tb) tb.classList.add('active');
            var titles = {
              match: '今日比赛',
              plan: '今日方案',
              'quant-rank': '量化数据排行榜',
              rank: '今日推荐榜',
              hit: '命中率数据',
              filter: '推荐方向命中查询',
              income: '方案收入',
              backtest: '回测分析',
              scheme: '方案设计',
            };
            var titleEl = document.getElementById('navTitle');
            if (titleEl && titles[last]) titleEl.textContent = titles[last];
            var nav = document.getElementById('navbar');
            if (nav) nav.classList.remove('home-mode');
            var backEl = document.getElementById('navBack');
            if (backEl) backEl.style.display = 'flex';
          } else {
            var tb = document.getElementById('tab-home');
            if (tb) tb.classList.add('active');
            var nav = document.getElementById('navbar');
            if (nav) nav.classList.add('home-mode');
          }
        } catch (e) {}
      })();
    </script>
